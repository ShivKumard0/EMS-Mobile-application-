<script>
/* Phone with the browser's "Desktop site" on: the viewport tag is ignored and the page is laid out
   about 980 px wide, then shrunk to the screen, so the app looks tiny. Zoom it back to the phone's
   own width. A normal phone, a tablet and a computer are left alone. */
(function(){
  var d=document.documentElement;
  function fit(){
    var sw=screen.width,w=window.innerWidth,touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
    if(touch&&sw&&sw<=500&&w>sw*1.25){
      var z=w/sw;d.style.zoom=z.toFixed(4);d.classList.add('dsk');
      d.style.setProperty('--vh',(window.innerHeight/z/100).toFixed(3)+'px');
    }else if(d.classList.contains('dsk')){d.style.zoom='';d.classList.remove('dsk');d.style.removeProperty('--vh');}
  }
  fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,250);});
})();
</script>
<link rel="stylesheet" href="css/mobile.css?v=20261114f">
</head>
<body>
<div id="app"></div>
<noscript>Turn on JavaScript to use ADT.</noscript>

<script src="js/kyc.js?v=20261114f"></script>
<script>
/* Offline store (sw.js): keeps the receipt reader on the phone and lets the app open without internet. */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
/* New version: when the app is opened again (from the background), it checks for a newer version and reloads itself,
   except while a form or a sheet is open, so nothing typed is lost. */
(function(){
  if(!/^https?:$/.test(location.protocol))return;
  function cur(){var s=document.querySelector('script[src*="js/app.js"]'),m=s&&/v=(\w+)/.exec(s.getAttribute('src'));return m?m[1]:'';}
  function busy(){return /^#\/(expenses\/new|t\/[^\/]+\/dispute)/.test(location.hash)||!!document.getElementById('sheet');}
  var on=false,pending=false;
  /* A newer version found while a form is open waits, and is loaded as soon as the form is left. */
  function check(){if(on||navigator.onLine===false)return;on=true;
    fetch('./',{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){on=false;var m=/js\/app\.js\?v=(\w+)/.exec(t);if(m&&cur()&&m[1]!==cur()){pending=m[1];if(!busy())go();}}).catch(function(){on=false;});}
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check();});
  window.addEventListener('pageshow',function(e){if(e.persisted)check();});
  /* one automatic reload per new version, so a page cache that lags behind can never cause a loop */
  function go(){try{if(sessionStorage.getItem('adt-upd')===pending)return;sessionStorage.setItem('adt-upd',pending);}catch(e){}location.reload();}
  window.addEventListener('hashchange',function(){if(pending&&!busy())go();});
  /* also on first load: an app opened from the home screen gets the newest version */
  window.addEventListener('load',function(){setTimeout(check,1500);});
})();
</script>
</body>
