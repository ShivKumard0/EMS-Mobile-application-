<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ADT">
<meta name="format-detection" content="telephone=no">
<title>ADT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script>
/* Phone with the browser's "Desktop site" on: the viewport tag is ignored and the page is laid out
   about 980 px wide, then shrunk to the screen, so the app looks tiny. Zoom it back to the phone's
   own width. A normal phone, a tablet and a computer are left alone. */
(function(){
  var d=document.documentElement;
  function fit(){
    var sw=screen.width,w=window.innerWidth,touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
    if(touch&&sw&&sw<=500&&w>sw*1.25){
      var z=w/sw;d.style.zoom=z.toFixed(4);d.classList.add('dsk');
      d.style.setProperty('--vh',(window.innerHeight/z/100).toFixed(3)+'px');
    }else if(d.classList.contains('dsk')){d.style.zoom='';d.classList.remove('dsk');d.style.removeProperty('--vh');}
  }
  fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,250);});
})();
</script>
<link rel="stylesheet" href="css/mobile.css?v=20261111g">
</head>
<body>
<div id="app"></div>
<noscript>Turn on JavaScript to use ADT.</noscript>
<script src="js/data.js?v=20261111g"></script>
<script src="js/hr-data.js?v=20261111g"></script>
<script src="js/store.js?v=20261111g"></script>
<script src="js/app.js?v=20261111g"></script>
<script src="js/hr.js?v=20261111g"></script>
<script src="js/ocr.js?v=20261111g"></script>
<script src="js/att.js?v=20261111g"></script>
<script src="js/exp.js?v=20261111g"></script>
<script>
/* Offline store (sw.js): keeps the receipt reader on the phone and lets the app open without internet. */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
